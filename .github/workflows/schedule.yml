name: Scheduled IP Traceroute Probe

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Traceroute Probe
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python probe.py

      # --- 新增：使用 pagecrypt 進行 AES 靜態網頁加密 ---
      - name: Encrypt HTML dashboard
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          npx -y staticrypt index.html -p "$PAGE_PASSWORD" --salt "ip-tracer-salt-2026" --short --remember 30 --template-color-primary "#2563eb" --template-color-secondary "#0b0f19" && mv encrypted/index.html index.html
      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html monitor_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update routing dashboard" && git push)
