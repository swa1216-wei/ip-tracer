name: Scheduled IP Traceroute Probe

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 給予 Actions 發布 GitHub Pages 與讀寫倉庫的最高權限
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Traceroute Probe
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python probe.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html monitor_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update routing dashboard" && git push)

      # 直接在同一個流程中把最新的 index.html 發布到 GitHub Pages！
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
