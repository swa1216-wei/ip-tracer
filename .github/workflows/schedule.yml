name: Scheduled IP Traceroute Probe

on:
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分鐘定期巡檢一次
  workflow_dispatch:        # 支援 GitHub 頁面點擊手動執行

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Traceroute Probe
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python probe.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html monitor_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update routing dashboard [skip ci]" && git push)
