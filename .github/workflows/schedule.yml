name: Periodic IP Traceroute

on:
  schedule:
    # 改為每 15 分鐘自動巡檢一次
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 執行探測腳本並產出網頁
        run: python3 probe.py

      - name: 保存歷史狀態檔案至倉庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor_state.json || true
          git commit -m "chore: 更新路由監控狀態快照 [skip ci]" || true
          git push || true

      - name: 發布網頁至 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
          keep_files: false
